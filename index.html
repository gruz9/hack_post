<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게시판</title>
<style>
  :root {
    --bg: #e9efe6;
    --paper: #fffdf7;
    --ink: #1f2a24;
    --muted: #6b776f;
    --line: #cfd8cb;
    --accent: #2f6b4f;
    --danger: #b3382c;
    --pin: #d9534f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17201b;
      --paper: #202b24;
      --ink: #e7eee8;
      --muted: #94a39a;
      --line: #33423a;
      --accent: #6fbf97;
      --danger: #ef7d70;
      --pin: #ef7d70;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 16px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.6;
  }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.9rem; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 24px; }

  form {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 16px;
    display: grid;
    gap: 10px;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  label { font-size: 0.85rem; color: var(--muted); display: grid; gap: 4px; }
  input, textarea {
    font: inherit;
    color: inherit;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 8px 10px;
    width: 100%;
  }
  textarea { min-height: 96px; resize: vertical; }
  input:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .count { font-size: 0.8rem; color: var(--muted); }
  button {
    font: inherit;
    cursor: pointer;
    border: 0;
    border-radius: 4px;
    padding: 8px 18px;
    background: var(--accent);
    color: #fff;
  }
  @media (prefers-color-scheme: dark) { button { color: #10201a; } }
  button:disabled { opacity: 0.5; cursor: default; }
  button.ghost {
    background: transparent;
    color: var(--muted);
    padding: 2px 8px;
    border: 1px solid var(--line);
    font-size: 0.8rem;
  }
  button.ghost:hover { color: var(--danger); border-color: var(--danger); }

  #msg { min-height: 1.4em; margin: 10px 2px 0; font-size: 0.9rem; color: var(--danger); }
  #msg.ok { color: var(--accent); }

  #list { display: grid; gap: 14px; margin-top: 18px; }
  article {
    position: relative;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 18px 16px 14px;
  }
  article::before {
    content: "";
    position: absolute;
    top: -5px; left: 16px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--pin);
  }
  .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
  .name { font-weight: 700; }
  .time { color: var(--muted); font-size: 0.8rem; margin-left: 8px; font-weight: 400; }
  .body { white-space: pre-wrap; word-break: break-word; margin: 0; }
  .del-form { display: none; gap: 8px; margin-top: 10px; align-items: center; }
  .del-form.open { display: flex; }
  .del-form input { max-width: 180px; padding: 5px 8px; }
  .del-form button { padding: 5px 12px; background: var(--danger); }
  .empty { text-align: center; color: var(--muted); padding: 32px 0; }
</style>
</head>
<body>
<main>
  <h1>게시판</h1>
  <p class="sub">글을 남기면 모두가 볼 수 있어요. 삭제할 때는 쓸 때 정한 비밀번호가 필요해요.</p>

  <form id="post-form">
    <div class="row">
      <label>이름
        <input id="name" maxlength="20" required autocomplete="nickname">
      </label>
      <label>비밀번호 (삭제할 때 사용)
        <input id="password" type="password" minlength="4" required autocomplete="new-password">
      </label>
    </div>
    <label>내용
      <textarea id="content" maxlength="500" required></textarea>
    </label>
    <div class="foot">
      <span class="count"><span id="len">0</span> / 500</span>
      <button type="submit" id="submit">글 올리기</button>
    </div>
  </form>

  <div id="msg" role="status" aria-live="polite"></div>
  <section id="list" aria-label="게시글 목록"></section>
</main>

<script>
  // 배포한 Worker 주소로 바꿔 주세요. (예: https://my-board.내계정.workers.dev)
  const API = "https://my-board.YOUR-ACCOUNT.workers.dev/api/posts";

  const $ = (id) => document.getElementById(id);
  const listEl = $("list"), msgEl = $("msg");

  function say(text, ok = false) {
    msgEl.textContent = text;
    msgEl.className = ok ? "ok" : "";
  }

  function timeAgo(iso) {
    const s = Math.floor((Date.now() - new Date(iso)) / 1000);
    if (s < 60) return "방금 전";
    if (s < 3600) return Math.floor(s / 60) + "분 전";
    if (s < 86400) return Math.floor(s / 3600) + "시간 전";
    return new Date(iso).toLocaleDateString("ko-KR");
  }

  async function api(path, options) {
    const res = await fetch(API + path, options);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "요청에 실패했어요.");
    return data;
  }

  function render(posts) {
    listEl.replaceChildren();
    if (!posts.length) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = "아직 글이 없어요. 첫 글을 남겨 보세요.";
      listEl.append(p);
      return;
    }
    for (const post of posts) listEl.append(card(post));
  }

  function card(post) {
    const el = document.createElement("article");

    const meta = document.createElement("div");
    meta.className = "meta";
    const who = document.createElement("div");
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = post.name;          // textContent: XSS 방지
    const time = document.createElement("span");
    time.className = "time";
    time.textContent = timeAgo(post.createdAt);
    who.append(name, time);

    const openBtn = document.createElement("button");
    openBtn.type = "button";
    openBtn.className = "ghost";
    openBtn.textContent = "삭제";
    meta.append(who, openBtn);

    const body = document.createElement("p");
    body.className = "body";
    body.textContent = post.content;

    const del = document.createElement("form");
    del.className = "del-form";
    const pw = document.createElement("input");
    pw.type = "password";
    pw.placeholder = "비밀번호";
    pw.required = true;
    pw.setAttribute("aria-label", "삭제 비밀번호");
    const confirm = document.createElement("button");
    confirm.type = "submit";
    confirm.textContent = "삭제하기";
    del.append(pw, confirm);

    openBtn.addEventListener("click", () => {
      del.classList.toggle("open");
      if (del.classList.contains("open")) pw.focus();
    });

    del.addEventListener("submit", async (e) => {
      e.preventDefault();
      confirm.disabled = true;
      try {
        await api("/" + post.id, {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: pw.value }),
        });
        say("글을 삭제했어요.", true);
        load();
      } catch (err) {
        say(err.message);
        confirm.disabled = false;
      }
    });

    el.append(meta, body, del);
    return el;
  }

  async function load() {
    try {
      render(await api("", {}));
    } catch (err) {
      say("목록을 불러오지 못했어요. API 주소를 확인해 주세요.");
    }
  }

  $("content").addEventListener("input", (e) => ($("len").textContent = e.target.value.length));

  $("post-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("submit");
    btn.disabled = true;
    try {
      await api("", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: $("name").value,
          password: $("password").value,
          content: $("content").value,
        }),
      });
      $("content").value = "";
      $("password").value = "";
      $("len").textContent = "0";
      say("글을 올렸어요.", true);
      load();
    } catch (err) {
      say(err.message);
    } finally {
      btn.disabled = false;
    }
  });

  load();
</script>
</body>
</html>
